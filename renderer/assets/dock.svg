<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 190" width="140" height="190">
  <!-- Crumby charging / self-emptying dock, top-down view -->
  <defs>
    <linearGradient id="ramp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1d20"/>
      <stop offset="1" stop-color="#0b0b0c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe07a"/>
      <stop offset="0.5" stop-color="#e2ad1f"/>
      <stop offset="1" stop-color="#9c7108"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#e2e2e5"/>
      <stop offset="0.9" stop-color="#a9a9ae"/>
      <stop offset="1" stop-color="#8b8b91"/>
    </linearGradient>
    <linearGradient id="bag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8d8d92"/>
      <stop offset="1" stop-color="#5d5d62"/>
    </linearGradient>
  </defs>

  <!-- ramp (robot parks here) -->
  <rect x="10" y="0" width="120" height="122" rx="14" fill="url(#ramp)" stroke="#2c2c30" stroke-width="1"/>
  <g stroke="#2a2a2e" stroke-width="1.4">
    <line x1="18" y1="22" x2="122" y2="22"/><line x1="18" y1="28" x2="122" y2="28"/>
    <line x1="18" y1="34" x2="122" y2="34"/><line x1="18" y1="40" x2="122" y2="40"/>
    <line x1="18" y1="46" x2="122" y2="46"/><line x1="18" y1="52" x2="122" y2="52"/>
    <line x1="18" y1="58" x2="122" y2="58"/><line x1="18" y1="64" x2="122" y2="64"/>
    <line x1="18" y1="70" x2="122" y2="70"/><line x1="18" y1="76" x2="122" y2="76"/>
    <line x1="18" y1="82" x2="122" y2="82"/><line x1="18" y1="88" x2="122" y2="88"/>
    <line x1="18" y1="94" x2="122" y2="94"/>
    
  </g>
  <!-- charging contacts -->
  <rect x="36" y="94" width="20" height="6" rx="3" fill="url(#gold)"/>
  <rect x="84" y="94" width="20" height="6" rx="3" fill="url(#gold)"/>

  <!-- silver base -->
  <rect x="2" y="110" width="136" height="78" rx="13" fill="url(#base)" stroke="#7a7a80" stroke-width="1.4"/>
  <rect x="5" y="112.5" width="130" height="3" rx="1.5" fill="#fff" opacity="0.9"/>
  <!-- vents -->
  <g stroke="#55555a" stroke-width="2.2" stroke-linecap="round">
    <line x1="9" y1="132" x2="20" y2="132"/><line x1="9" y1="139" x2="20" y2="139"/>
    <line x1="9" y1="146" x2="20" y2="146"/><line x1="9" y1="153" x2="20" y2="153"/>
    <line x1="9" y1="160" x2="20" y2="160"/>
    <line x1="120" y1="132" x2="131" y2="132"/><line x1="120" y1="139" x2="131" y2="139"/>
    <line x1="120" y1="146" x2="131" y2="146"/><line x1="120" y1="153" x2="131" y2="153"/>
    <line x1="120" y1="160" x2="131" y2="160"/>
  </g>
  <!-- bin window -->
  <rect x="27" y="126" width="86" height="40" rx="8" fill="#0c0c0e" stroke="#4a4a50" stroke-width="1"/>
  <rect x="59" y="130" width="22" height="32" rx="5" fill="url(#bag)"/>
  <text x="70" y="182" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#5c5c62" letter-spacing="0.5">crumby</text>
</svg>
