name: Build Crumb.exe

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build
        run: GOPROXY=https://proxy.golang.org,direct bash scripts/build-win.sh
      - name: Images zip
        run: cd renderer/assets && zip -q ../../dist/imagens-robo.zip robot.svg robot.png dock.svg dock.png icon.png
      - uses: actions/upload-artifact@v4
        with:
          name: Crumb
          path: dist/*
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Crumb ${{ github.ref_name }}
          files: |
            dist/Crumb.exe
            dist/imagens-robo.zip
          body: |
            Crumb para Windows 10/11 (x64).

            - **Crumb.exe**: arquivo único, é só baixar e abrir. Na primeira vez ele leva alguns segundos para se instalar.
            - **imagens-robo.zip**: imagens do robô e da base (SVG + PNG).

            O executável não é assinado. Se aparecer o aviso do SmartScreen, clique em *Mais informações → Executar assim mesmo*. Esc fecha o app e devolve a área de trabalho.
